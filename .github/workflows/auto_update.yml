name: Auto Update Matka Results

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Scraper
        run: python scraper.py
      - name: Save Updated Data
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update results" || exit 0
          git push
